services:
  rescuemash:
    build: .
    ports:
      - "127.0.0.1:4000:4000"
      - "43690:43690/udp"
      - "43691:43691/udp"
    env_file: .env
    environment:
      DATA_DIR: /data
    volumes:
      - rescuemash_data:/data
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  rescuemash_data:
